<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MileMark</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 16px; max-width: 420px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: #94a3b8; font-size: 0.85rem; margin-bottom: 16px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tabs button { flex: 1; padding: 10px; background: #1e293b; border: none; color: #cbd5e1; border-radius: 10px; }
  .tabs button.active { background: #3b82f6; color: white; }
  .card { background: #1e293b; border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .btn { width: 100%; padding: 14px; background: #3b82f6; color: white; border: none; border-radius: 12px; font-size: 1rem; margin: 6px 0; }
  .btn.ghost { background: #334155; }
  .screen { display: none; }
  .screen.on { display: block; }
  input, select, textarea { width: 100%; padding: 12px; margin: 6px 0 12px; background: #0f172a; color: white; border: 1px solid #475569; border-radius: 10px; box-sizing: border-box; }
  .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #334155; }
  .row:last-child { border: none; }
</style>
</head>
<body>
<h1>MileMark</h1>
<div class="sub">Unit 101 · Alex Rivera</div>

<div class="tabs">
  <button class="active" onclick="show('home')">Home</button>
  <button onclick="show('submit')">Submit</button>
  <button onclick="show('docs')">Docs</button>
</div>

<div id="home" class="screen on">
  <div class="card">
    <button class="btn" onclick="show('submit')">📷 Submit Document</button>
    <button class="btn ghost">📍 Trip Status</button>
  </div>
  <div class="card">
    <div class="row"><span>Q4 IFTA receipts</span><span>2 missing</span></div>
    <div class="row"><span>Ticket #8821</span><span>Draft ready</span></div>
  </div>
</div>

<div id="submit" class="screen">
  <div class="card">
    <strong>Submit Document</strong><br><br>
    <label>Type</label>
    <select id="docType"><option>Fuel Receipt</option><option>Scale Ticket</option><option>Traffic Ticket</option><option>Maintenance Invoice</option><option>Other</option></select>
    <label>Notes</label>
    <textarea id="notes" rows="2"></textarea>
    <label>Photo</label>
    <input type="file" accept="image/*" capture="environment" id="fileInput">
    <button class="btn" onclick="submitDoc()">Upload</button>
    <div id="result"></div>
  </div>
</div>

<div id="docs" class="screen">
  <div class="card">
    <div class="row"><span>Fuel receipt · Ohio</span><span>Today</span></div>
    <div class="row"><span>Scale ticket · Indiana</span><span>Yesterday</span></div>
    <div class="row"><span>Maintenance · Tires</span><span>Nov 4</span></div>
  </div>
</div>

<script>
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}
function submitDoc() {
  const type = document.getElementById('docType').value;
  const file = document.getElementById('fileInput').files[0];
  const result = document.getElementById('result');
  if (!file) { result.innerHTML = '<p style="color:#f87171">Please add a photo first.</p>'; return; }
  result.innerHTML = '<p style="color:#4ade80">✓ ' + type + ' submitted</p>';
  document.getElementById('fileInput').value = '';
}
</script>
</body>
</html>
